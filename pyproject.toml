[project]
name = "pathkernel"
version = "0.1.0"
description = "Desktop CAM/viewer app framework for Gerber and Excellon files"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "PathKernel" }
]
dependencies = [
  "PySide6>=6.6,<7.0",
  "pcb-tools>=0.1.6",
  "pyclipper>=1.3.0.post6",
  "shapely>=2.0",
]

[project.optional-dependencies]
maintained-parser = [
  "gerbonara @ git+https://github.com/jaseg/gerbonara.git",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
pathkernel = "app.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
